# Featured projects shown as constellation stars
# Each project needs:
#   repo: "owner/repo-name"   — GitHub repository path
#   arm: 0-2                  — Which galaxy arm to associate with (index)
#   description: "..."        — Short description shown on the card
projects:
  - repo: "SerenicuS/MommySuite"
    arm: 0
    description: "Custom Rust shell with command execution, piping, and redirections. Focus: Systems programming & process management."
  - repo: "SerenicuS/MommySuite"
    arm: 1
    description: "Esoteric language compiler targeting C with lexing, parsing, and code generation. Focus: Language design & compiler theory."
  - repo: "SerenicuS/custom-shell"
    arm: 0
    description: "Lightweight shell in pure C with built-in commands and file I/O. Focus: Low-level systems programming."
  - repo: "SerenicuS/custom-text-editor"
    arm: 2
    description: "Terminal-based text editor with buffer management and cursor tracking. Focus: Text processing & terminal UI."

# Theme color overrides — Dark Gray-Blue "Abyssal" Palette
# Inspired by deep ocean trenches and stormy night skies
theme:
  void: "#0b0e14"              # Deepest abyss — almost black with a hint of blue
  nebula: "#111820"            # Card backgrounds — dark slate
  star_dust: "#1e2a36"         # Borders, dividers — muted steel blue
  synapse_cyan: "#5bc0eb"      # Primary accent — soft electric blue (less neon, more atmospheric)
  dendrite_violet: "#8b9dc3"   # Secondary accent — dusty periwinkle blue
  axon_amber: "#6c8ba0"        # Tertiary accent — muted gray-blue (replaces amber for a cooler tone)
  text_bright: "#e8edf5"       # Primary text — icy white-blue
  text_dim: "#9bb0c4"          # Secondary text — soft gray-blue
  text_faint: "#5a6f82"        # Muted text, labels — deep shadow blue

# Stats configuration — which metrics to show on the telemetry card
stats:
  metrics:
    - "commits"
    - "stars"
    - "prs"
    - "issues"
    - "repos"

# Language display settings
languages:
  exclude:                     # Languages to hide from the telemetry chart
    - "HTML"
    - "CSS"
    - "Shell"
    - "Makefile"
  max_display: 8               # Maximum number of languages to show